<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>華語練習簿 – ฝึกและจำลองสอบ TOCFL A1–B2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#1b1815;--card:#26211d;--ink:#f1e8d6;--mute:#a89c8a;--line:#3d352d;--red:#e0584d;--redtx:#1b1815;--ok:#6cc58d;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6;min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px}
.zh{font-family:'Noto Serif TC','PMingLiU','Songti TC',serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.seal{background:var(--red);color:var(--redtx);width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-size:26px;font-weight:700;transform:rotate(-4deg);flex:none}

.stat b{display:block;font-size:1.1rem;color:var(--ink)}
.main-nav{display:flex;gap:8px;margin-bottom:12px}
.main-nav button{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.main-nav button.on{background:var(--ink);color:var(--bg)}
nav.sub{display:flex;border-bottom:2px solid var(--ink);margin-bottom:16px}
nav.sub button{flex:1;background:none;border:0;padding:9px 4px;font:inherit;font-weight:500;color:var(--mute);cursor:pointer;border-radius:8px 8px 0 0}
nav.sub button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;box-shadow:4px 4px 0 var(--line)}
.big{font-size:3.2rem;line-height:1.2;text-align:center;margin:10px 0 4px}
.cen{text-align:center}.mute{color:var(--mute)}
.py{font-size:1.15rem;text-align:center}.zy{text-align:center;color:var(--mute)}
.th{font-size:1.45rem;text-align:center;font-weight:700;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row>*{flex:1}
button.b{font:inherit;font-weight:500;padding:12px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;min-height:48px}
button.b:disabled{opacity:.55;cursor:default}
button.pri{background:var(--red);border-color:var(--red);color:var(--redtx)}
button.opt{width:100%;text-align:left;margin-top:8px}
button.opt.sel{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--card))}
button.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
button.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.tog{display:flex;gap:14px;justify-content:center;margin-bottom:8px;font-size:.9rem;color:var(--mute)}.tog input{accent-color:var(--red)}
.fb{margin-top:12px;font-weight:500}
.sent{font-size:1.7rem;text-align:center;margin:8px 0}
.speak{display:block;margin:12px auto;width:88px;height:88px;border-radius:50%;font-size:2.2rem;border:2px solid var(--ink);background:var(--red);color:var(--redtx);cursor:pointer}
.speak:disabled{opacity:.45}
.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
#tm{color:var(--red);font-variant-numeric:tabular-nums}
.score{font-size:2.6rem;font-weight:700;text-align:center;line-height:1.1}
.rv{border-top:1px dashed var(--line);padding:10px 0;font-size:.92rem}
footer{margin-top:22px;font-size:.78rem;color:var(--mute);text-align:center}
</style>
</head>

<main>
<header><div class="seal zh">華</div><div><h1>華語練習簿</h1><p>ฝึกและจำลองสอบ TOCFL ระดับ A1–B2</p></div></header>

<section id="view"></section>
<footer>ข้อมูลในเว็บเป็นชุดตัวอย่างที่คัดเอง ไม่ใช่รายการทางการของ SC-TOP · ระดับคำศัพท์เป็นการประมาณ<br>แก้ไข/เพิ่มคำและประโยคได้ในโค้ด (W0, RB1, WB2 ฯลฯ) · ความก้าวหน้าบันทึกในเบราว์เซอร์นี้</footer>
</main>

function gen(k,n){const a=[],seen=new Set();for(let t=0;t<400&&a.length<n;t++){const x=k==='L'?qL():qR(),key=x.say||x.p;if(!seen.has(key)){seen.add(key);a.push(x)}}return a}
function pickWord(ex){const idx=lv().w.map((w,i)=>i).filter(i=>i!==ex),pool=idx.filter(i=>(S.box[lv().w[i][0]]||0)<3);return pick(pool.length?pool:idx)}
function setLv(k){S.lv=k;save();M=null;clearInterval(tmr);q=null;cur=pickWord(-1);flip=false;render()}
function chrome(){$('#chips').innerHTML=Object.keys(L).map(k=>`<button class="chip ${k===S.lv?'on':''}" onclick="setLv('${k}')"><b>${k}</b><small>${L[k].s}</small></button>`).join('');
const k=lv().w.filter(w=>(S.box[w[0]]||0)>=3).length,s=st();
$('#stats').innerHTML=`<div class="stat">จำได้แล้ว<b>${k}/${lv().w.length}</b></div><div class="stat">ทำแบบฝึกหัด<b>${s.n}</b></div><div class="stat">ตอบถูก<b>${s.n?Math.round(s.ok/s.n*100)+'%':'–'}</b></div>`;
document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode))}
function opts(x,pickI,done,fn){return x.o.map((c,i)=>`<button class="b opt ${done?(i===x.a?'right':i===pickI?'wrong':''):(i===pickI?'sel':'')}" ${done?'disabled':''} onclick="${fn}(${i})">${c}</button>`).join('')}
function render(){chrome();const v=$('#view');
if(mode==='mock')return mockView(v);
const nav=`<nav class="sub">${[['card','การ์ดคำศัพท์'],['listen','ฝึกฟัง'],['read','ฝึกอ่าน']].map(([k,t])=>`<button class="${k===sub?'on':''}" onclick="sub='${k}';q=null;render()">${t}</button>`).join('')}</nav>`;
if(sub==='card'){const w=lv().w[cur];
v.innerHTML=nav+`<div class="tog"><label><input type="checkbox" ${S.py?'checked':''} onchange="S.py=this.checked;save();render()"> พินอิน</label><label><input type="checkbox" ${S.zy?'checked':''} onchange="S.zy=this.checked;save();render()"> จู้อิน</label></div>
<div class="card" onclick="flip=!flip;render()" style="cursor:pointer"><div class="big zh">${w[0]}</div>${S.py?`<div class="py">${w[1]}</div>`:''}${S.zy?`<div class="zy">${w[2]}</div>`:''}<div class="th">${flip?w[3]:'<span class="mute" style="font-size:1rem;font-weight:400">แตะการ์ดเพื่อดูความหมาย</span>'}</div></div>
<div class="row"><button class="b" onclick="say(lv().w[cur][0])">🔊 ฟังเสียง</button></div>
<div class="row"><button class="b" onclick="rate(0)">ยังจำไม่ได้</button><button class="b pri" onclick="rate(1)">จำได้แล้ว</button></div>`;return}
if(!q){q=sub==='listen'?gen('L',1)[0]:gen('R',1)[0];if(sub==='listen')setTimeout(()=>say(q.say),250)}
v.innerHTML=nav+`<div class="card"><p class="cen mute">${sub==='listen'?q.p:'เลือกคำตอบที่ถูกต้อง'}</p>${sub==='listen'?`<button class="speak" onclick="say(q.say)" aria-label="ฟังอีกครั้ง">🔊</button>`:q.p}
${opts(q,q.pick,q.done,'ans')}${q.done?`<div class="fb"><span class="zh">${q.ex}</span></div><div class="row"><button class="b pri" onclick="q=null;render()">ข้อต่อไป</button></div>`:''}</div>`}
function rate(g){const k=lv().w[cur][0];S.box[k]=g?Math.min((S.box[k]||0)+1,4):0;save();cur=pickWord(cur);flip=false;render()}
function ans(i){q.done=true;q.pick=i;const s=st();s.n++;if(i===q.a)s.ok++;save();render()}
// ---------- จำลองสอบ ----------
const NQ=10,MIN=12;
function startMock(){M={ph:'L',i:0,qs:{L:gen('L',NQ),R:gen('R',NQ)},a:{L:[],R:[]},pl:{}};timer();render()}
function timer(){M.end=Date.now()+MIN*60000;clearInterval(tmr);tmr=setInterval(()=>{const s=Math.max(0,Math.round((M.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent=fmt(s);if(s<=0)nextSec()},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function nextSec(){if(M.ph==='L'){M.ph='R';M.i=0;timer()}else{clearInterval(tmr);M.ph='done';const r=sc();S.best[S.lv]=Math.max(S.best[S.lv]||0,r.L+r.R);save()}render()}
const sc=()=>({L:M.qs.L.filter((x,i)=>M.a.L[i]===x.a).length,R:M.qs.R.filter((x,i)=>M.a.R[i]===x.a).length});
function pk(i){M.a[M.ph][M.i]=i;render()}
function go(d){M.i+=d;render()}
function playM(){if(M.pl[M.i])return;M.pl[M.i]=1;say(M.qs.L[M.i].say);render()}
function mockView(v){
if(!M){const b=S.best[S.lv];v.innerHTML=`<div class="card"><h2 style="margin:0 0 8px">จำลองสอบระดับ ${S.lv} (${lv().s})</h2>
<p>แบ่งเป็น 2 ส่วนเหมือนข้อสอบจริง คือ <b>ฟัง</b> แล้วตามด้วย <b>อ่าน</b> ส่วนละ ${NQ} ข้อ เวลาส่วนละ ${MIN} นาที</p>
<p class="mute">กติกา: ข้อฟังเล่นเสียงได้ครั้งเดียว ไม่มีเฉลยระหว่างสอบ กลับไปแก้ข้อก่อนหน้าได้ในส่วนเดียวกัน เมื่อหมดเวลาจะข้ามส่วนต่อไปอัตโนมัติ</p>
<p class="mute">ข้อสอบจริงมี 50 ข้อต่อส่วน ใช้เวลาประมาณ 60 นาทีต่อส่วน ชุดนี้เป็นฉบับย่อสำหรับซ้อมความเคยชิน</p>
${b!=null?`<p>คะแนนสูงสุดของระดับนี้: <b>${b}/${NQ*2}</b></p>`:''}<div class="row"><button class="b pri" onclick="startMock()">เริ่มทำข้อสอบ</button></div></div>`;return}
if(M.ph==='done'){const r=sc(),tot=r.L+r.R,pct=Math.round(tot/(NQ*2)*100);
const rv=['L','R'].flatMap(k=>M.qs[k].map((x,i)=>[k,x,M.a[k][i]])).filter(([k,x,a])=>a!==x.a).map(([k,x,a])=>`<div class="rv"><b>${k==='L'?'ฟัง':'อ่าน'}</b> · <span class="zh">${x.ex}</span><br><span class="mute">คุณตอบ: ${a==null?'ไม่ได้ตอบ':x.o[a]} · ที่ถูก: ${x.o[x.a]}</span></div>`).join('');
v.innerHTML=`<div class="card"><p class="cen mute" style="margin:0">ผลจำลองสอบระดับ ${S.lv}</p><div class="score">${tot}/${NQ*2}</div><p class="cen">${pct}% · ฟัง ${r.L}/${NQ} · อ่าน ${r.R}/${NQ}</p>
<p class="mute cen" style="font-size:.85rem">เกณฑ์ผ่านจริงเป็นคะแนนสเกลของ TOCFL ซึ่งแปลงจากข้อสอบเต็ม ตัวเลขนี้ใช้ดูพัฒนาการของคุณเท่านั้น ไม่ใช่การทำนายว่าสอบผ่าน</p>
${rv?`<h3 style="margin:14px 0 0">ข้อที่ผิด / ไม่ได้ตอบ</h3>${rv}`:'<p class="cen"><b>ถูกทุกข้อ</b></p>'}<div class="row"><button class="b pri" onclick="M=null;render()">กลับ</button><button class="b" onclick="startMock()">สอบอีกชุด</button></div></div>`;return}
const k=M.ph,x=M.qs[k][M.i],a=M.a[k][M.i],last=M.i===NQ-1;
const s=Math.max(0,Math.round((M.end-Date.now())/1000));
v.innerHTML=`<div class="bar"><span>${k==='L'?'ส่วนฟัง':'ส่วนอ่าน'} · ข้อ ${M.i+1}/${NQ}</span><span id="tm">${fmt(s)}</span></div><div class="card">
${k==='L'?`<p class="cen mute" style="margin:0">${x.p}</p><button class="speak" ${M.pl[M.i]?'disabled':''} onclick="playM()" aria-label="เล่นเสียง">🔊</button><p class="cen mute" style="margin:0;font-size:.85rem">${M.pl[M.i]?'เล่นไปแล้ว (เล่นได้ครั้งเดียว)':'กดเล่นเสียง (ครั้งเดียว)'}</p>`:x.p}
${opts(x,a,false,'pk')}
<div class="row">${M.i>0?`<button class="b" onclick="go(-1)">ก่อนหน้า</button>`:''}${last?`<button class="b pri" onclick="nextSec()">${k==='L'?'ส่งส่วนฟัง → ไปส่วนอ่าน':'ส่งข้อสอบ'}</button>`:`<button class="b pri" onclick="go(1)">ถัดไป</button>`}</div></div>`}
$('#mnav').onclick=e=>{const m=e.target.dataset.m;if(!m)return;if(M&&M.ph!=='done'&&m==='learn'&&!confirm('ออกจากการสอบ? ความคืบหน้าจะหายไป'))return;mode=m;if(m==='learn'){M=null;clearInterval(tmr)}render()};
cur=pickWord(-1);render();
</script>
</body>
</html>
