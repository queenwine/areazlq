body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6;min-height:100vh;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px}

.py{font-size:1.15rem;text-align:center}.zy{text-align:center;color:var(--mute)}
.th{font-size:1.45rem;text-align:center;font-weight:700;margin:6px 0}

button.pri{background:var(--red);border-color:var(--red);color:var(--redtx)}
button.opt{width:100%;text-align:left;margin-top:8px}
button.opt.sel{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--card))}
button.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}

.fb{margin-top:12px;font-weight:500}
.sent{font-size:1.7rem;text-align:center;margin:8px 0}

.bar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}

.score{font-size:2.6rem;font-weight:700;text-align:center;line-height:1.1}
.rv{border-top:1px dashed var(--line);padding:10px 0;font-size:.92rem}

</main>

const OFF={"c": [{"t": "昨天我在整理書桌的時候，發現了一本很久沒{1}到的書。那本書是幾年{2}我父親送給我的。我打開那本書，裡面有一{3}卡片，那是父親給我的。卡片裡他{4}：「爸爸想送你最特別的十八歲生日禮物，看了好幾家店以後，{5}你買了這本書。希望這本書能{6}你明白一些道理。」看完卡片，我又把書讀了一遍。", "b": [["看", "開", "查", "遇"], ["前", "中", "上", "後"], ["張", "頁", "份", "片"], ["寫著", "說過", "讀著", "念過"], ["給", "對", "要", "向"], ["讓", "把", "被", "為"]], "k": "選詞填空", "src": "SC-TOP 模擬試題第三輯 Band B", "th": ""}, {"t": "李明的車子壞了，所以他最近{7}開車上班。李明的家{8}公司很遠，要是沒有車子的話，是很不{9}的。這個星期，李明每天早上得先坐公共汽車，{10}坐電車，才能到公司。{11}三、四天，李明覺得可以接受，但是久了他就覺得麻煩，才{12}汽車公司借他一台車，讓他能夠開車上、下班，汽車公司也答應了。", "b": [["不能", "最好", "還是", "沒空"], ["離", "從", "比", "往"], ["方便", "滿意", "容易", "放心"], ["然後", "後來", "以後", "結果"], ["頭", "第", "先", "早"], ["要求", "計畫", "忘記", "安排"]], "k": "選詞填空", "src": "SC-TOP 模擬試題第三輯 Band B", "th": ""}, {"t": "我家附近有一家書店。這家書店的客人不多，{13}書很多。書店老闆人很好，對客人總是很{14}。去那裡不一定要買書，也{15}只是看看書。在那裡看書，{16}看多久都行，沒有人會來吵你。記得有一次，書店剛開門，我{17}進去看書，不知道看了多久，{18}頭往外一看，才發現天都已經黑了。", "b": [["但是", "卻", "又", "不但"], ["客氣", "自由", "感謝", "高興"], ["可以", "會", "不必", "不該"], ["不管", "要是", "所以", "可能"], ["就", "還", "才", "再"], ["抬", "抽", "扔", "提"]], "k": "選詞填空", "src": "SC-TOP 模擬試題第三輯 Band B", "th": ""}], "r": [{"t": "根據一項芬蘭的研究發現，還在母親肚中的嬰兒，其實聽得見外界的聲音，而且會開始學習記憶。芬蘭一所大學讓三十三位懷孕母親，從懷孕二十九週到嬰兒出生那一天，每天聽一個芬蘭單字，每天重複播放同樣的聲音好幾百遍，等到嬰兒出生後，研究人員利用儀器觀察嬰兒腦部活動，記錄他們聽到聲音的反應，結果發現，嬰兒聽到過去熟悉的聲音時反應特別明顯。<br>事實上，一九八八年就已經有類似的研究發現，如果母親懷孕時喜歡看連續劇，孩子出生後也會受到影響，迷上連續劇，或是至少對於劇情中常出現的音樂或歌曲感到熟悉。<br>對此，芬蘭研究人員表示：「已經有證據顯示，在母親肚中的嬰兒會學習。而且嬰兒出生後，仍會記得當初聽過的歌曲或是某一部分的詞句。」研究人員也發現，在母親肚中就聽過同一單字的嬰兒，說出單字的能力，比沒聽過的嬰兒更好。<br>美國語言專家寇兒表示：「從研究結果來看，人類並不是出生後才開始學習語言，而是在母親肚中時就開始透過聽聲音去學習。對於人腦在發育初期就具備這項能力，我感到相當意外。」", "qs": [{"q": "文章中提到的實驗是怎麼進行的？", "o": ["讓懷孕的母親每天反覆聽單字", "用儀器讓嬰兒說話", "每天讓嬰兒聽同樣的音樂", "嬰兒出生後，每天播放一個單字"]}, {"q": "根據文章，下面哪一項是對的？", "o": ["語言專家寇兒對研究結果感到驚訝", "越早學習語言，記憶力越好", "母親看連續劇，嬰兒比較聰明", "這項研究結果跟以前的互相矛盾"]}, {"q": "這篇短文屬於以下哪一類的研究？", "o": ["人類的早期教育", "聽力障礙的症狀", "音樂對人的影響", "懷孕期間的變化"]}], "src": "SC-TOP 模擬試題第三輯 Band B", "th": ""}, {"t": "我們都知道，小時候大人說給我們聽的故事，大部分都不是真的。即使早就知道這個事實，但長大以後，當我們有了自己的小孩，還是會把聽過的故事重新說一遍，就這樣一代一代，讓故事繼續下去。這種對幻想世界的好奇心，是每個小孩最珍貴的精神財富。 function render(){chrome();const v=$('#view');if(mode==='mock')return mockView(v);
const nav=`<nav class="sub">${[['card','การ์ดคำศัพท์'],['gap','ฝึกเติมคำ'],['pass','ฝึกบทความ']].map(([k,t])=>`<button class="${k===sub?'on':''}" onclick="sub='${k}';pg=null;render()">${t}</button>`).join('')}</nav>`;
if(sub==='card'){const w=lv().w[cur];
v.innerHTML=nav+`<div class="tog"><label><input type="checkbox" ${S.py?'checked':''} onchange="S.py=this.checked;save();render()"> พินอิน</label><label><input type="checkbox" ${S.zy?'checked':''} onchange="S.zy=this.checked;save();render()"> จู้อิน</label></div>
<div class="card" onclick="flip=!flip;render()" style="cursor:pointer"><div class="big zh">${w[0]}</div>${S.py?`<div class="py">${w[1]}</div>`:''}${S.zy?`<div class="zy">${w[2]}</div>`:''}<div class="th">${flip?w[3]:'<span class="mute" style="font-size:1rem;font-weight:400">แตะการ์ดเพื่อดูความหมาย</span>'}</div></div>
<div class="row"><button class="b" onclick="say(lv().w[cur][0])">🔊 ฟังเสียง</button></div>
<div class="row"><button class="b" onclick="rate(0)">ยังจำไม่ได้</button><button class="b pri" onclick="rate(1)">จำได้แล้ว</button></div>`;return}
if(!pg){pg=sub==='gap'?{qs:[Math.random()<.6?gapQ(pick(lv().r)):wordQ()]}:pick(pPages());ans=[];chk=false}
let h=nav+(sub==='gap'?pyBox():'<p class="mute cen" style="font-size:.85rem;margin:0 0 10px">บทความไม่มีพินอิน เหมือนข้อสอบจริง ต้องอ่านเอง</p>')+setHTML(pg,ans,chk,'pp');
if(sub==='gap'&&chk)h+=`<div class="fb zh">${pg.qs[0].ex}</div><div class="row"><button class="b pri" onclick="pg=null;render()">ข้อต่อไป</button></div>`;
if(sub==='pass'){if(!chk)h+=`<div class="row"><button class="b pri" onclick="grade();render()">ตรวจคำตอบ</button></div>`;
else{const k=pg.qs.filter((x,j)=>ans[j]===x.a).length;h+=`<div class="card" style="margin-top:12px"><b>ถูก ${k}/${pg.qs.length}</b>${pg.th?'<br><span class="mute">แปลบทความ:</span> '+pg.th:''}</div><div class="row"><button class="b pri" onclick="pg=null;render()">ทำชุดต่อไป</button></div>`}}
v.innerHTML=h}
function rate(g){const k=lv().w[cur][0];S.box[k]=g?Math.min((S.box[k]||0)+1,4):0;save();cur=pickWord(cur);flip=false;render()}
// ---------- จำลองสอบ (อ่านอย่างเดียว) ----------
function startMock(){const pgs=[gapPg(),...pPages()],n=pgs.reduce((t,g)=>t+g.qs.length,0);M={pgs,i:0,a:pgs.map(()=>[]),n,min:Math.ceil(n*1.2),ph:'run'};M.end=Date.now()+M.min*60000;clearInterval(tmr);tmr=setInterval(tick,1000);window.scrollTo(0,0);render()}
function tick(){const s=Math.max(0,Math.round((M.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent=fmt(s);if(s<=0)finish()}
const mscore=(g,i)=>g.qs.filter((x,j)=>M.a[i][j]===x.a).length;
function finish(){clearInterval(tmr);M.ph='done';const t=M.pgs.reduce((c,g,i)=>c+mscore(g,i),0);S.bestR[S.lv]=Math.max(S.bestR[S.lv]||0,Math.round(t/M.n*100));save();window.scrollTo(0,0);render()}
function mp(j,i){M.a[M.i][j]=i;render()}
function go(d){M.i+=d;window.scrollTo(0,0);render()}
function mockView(v){
if(!M){const b=S.bestR[S.lv],A=S.lv[0]==='A';v.innerHTML=`<div class="card"><h2 style="margin:0 0 8px">จำลองข้อสอบอ่าน ระดับ ${S.lv} (${lv().s})</h2>
<p>จัดข้อสอบตามโครงสร้างของ ${A?'Band A: เลือกคำเติมประโยค → เติมย่อหน้า → เลือกคำเติมในบทความ → อ่านจับใจความ (ตัวเลือก 3 ข้อ)':'Band B: เลือกคำเติม → อ่านจับใจความ (ตัวเลือก 4 ข้อ)'} โดยมี passage ให้อ่านและเติมคำ</p>
<p class="mute">จับเวลาตามสัดส่วนข้อสอบจริง (ประมาณ 1.2 นาทีต่อข้อ) ไม่เฉลยระหว่างสอบ ย้อนกลับไปแก้ได้ หมดเวลาแล้วส่งอัตโนมัติ</p>${A?'':'<p class="mute" style="font-size:.85rem">B1/B2 รวมโจทย์จากชุดข้อสอบจำลอง Band B ของ SC-TOP (ชุดที่ 3) ฉบับที่เป็นตัวอักษร</p>'}
<p class="mute" style="font-size:.85rem">ข้อสอบจริง Band A มี 50 ข้อ (ปรนัยสามตัวเลือก 40 ข้อ สี่ตัวเลือก 5 ข้อ และจับคู่ 5 ข้อ) ส่วน Band B มี 50 ข้อสี่ตัวเลือก ใช้เวลา 60 นาที ชุดนี้เป็นฉบับย่อ ยังไม่มีส่วนดูภาพและข้อจับคู่</p>
${b!=null?`<p>คะแนนสูงสุดของระดับนี้: <b>${b}%</b></p>`:''}<div class="row"><button class="b pri" onclick="startMock()">เริ่มทำข้อสอบ</button></div></div>`;return}
if(M.ph==='done'){const t=M.pgs.reduce((c,g,i)=>c+mscore(g,i),0),pct=Math.round(t/M.n*100);
const rv=M.pgs.map((g,i)=>{const w=g.qs.map((x,j)=>[x,j]).filter(([x,j])=>M.a[i][j]!==x.a);return w.length?`<div class="rv"><b>${g.sec}</b>${w.map(([x,j])=>`<div style="margin-top:6px">ข้อ ${j+1} · <span class="zh">${x.ex}</span><br><span class="mute">คุณตอบ: ${M.a[i][j]==null?'ไม่ได้ตอบ':x.o[M.a[i][j]]} · ที่ถูก: ${x.o[x.a]}</span></div>`).join('')}${g.th?`<div class="mute" style="margin-top:6px;font-size:.85rem">แปลบทความ: ${g.th}</div>`:''}</div>`:''}).join('');
v.innerHTML=`<div class="card"><p class="cen mute" style="margin:0">ผลจำลองสอบอ่าน ระดับ ${S.lv}</p><div class="score">${t}/${M.n}</div><p class="cen">${pct}%</p>
<p class="cen mute" style="font-size:.85rem">${M.pgs.map((g,i)=>g.sec+' '+mscore(g,i)+'/'+g.qs.length).join(' · ')}</p>
<p class="mute cen" style="font-size:.85rem">เกณฑ์ผ่านจริงเป็นคะแนนสเกลของ TOCFL ตัวเลขนี้ใช้ดูพัฒนาการเท่านั้น ไม่ใช่การทำนายว่าสอบผ่าน</p>
${rv?`<h3 style="margin:14px 0 0">ข้อที่ผิด / ไม่ได้ตอบ</h3>${rv}`:'<p class="cen"><b>ถูกทุกข้อ</b></p>'}<div class="row"><button class="b pri" onclick="M=null;render()">กลับ</button><button class="b" onclick="startMock()">สอบอีกชุด</button></div></div>`;return}
const g=M.pgs[M.i],last=M.i===M.pgs.length-1,sec=Math.max(0,Math.round((M.end-Date.now())/1000));
v.innerHTML=(M.i===0?pyBox():'')+`<div class="bar"><span>หน้า ${M.i+1}/${M.pgs.length}</span><span id="tm">${fmt(sec)}</span></div>`+setHTML(g,M.a[M.i],false,'mp')+
`<div class="row">${M.i>0?`<button class="b" onclick="go(-1)">ก่อนหน้า</button>`:''}${last?`<button class="b pri" onclick="finish()">ส่งข้อสอบ</button>`:`<button class="b pri" onclick="go(1)">ถัดไป</button>`}</div>`}
$('#mnav').onclick=e=>{const m=e.target.dataset.m;if(!m)return;if(M&&M.ph==='run'&&m==='learn'&&!confirm('ออกจากการสอบ? ความคืบหน้าจะหายไป'))return;mode=m;pg=null;if(m==='learn'){M=null;clearInterval(tmr)}render()};
cur=pickWord(-1);render();
</script>
</body>
</html>
